<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品检索</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand-lockup">
        <p class="eyebrow">Catalog</p>
        <h1>商品检索</h1>
      </div>
      <div class="top-side">
        <p id="status" class="status">正在连接商品库…</p>
        <details class="settings">
          <summary>设置</summary>
          <label class="api-key">
            接口密钥
            <input id="api-key" type="password" autocomplete="off" placeholder="本地可留空" />
          </label>
        </details>
      </div>
    </header>

    <main class="workspace">
      <section class="catalog">
        <form id="search-form" class="panel">
          <div class="modes" role="tablist">
            <button type="button" class="mode is-active" data-mode="text">描述</button>
            <button type="button" class="mode" data-mode="visual">外观</button>
            <button type="button" class="mode" data-mode="image">图片</button>
          </div>
          <p id="mode-hint" class="hint">按介绍、材质和规格查找。</p>

          <label class="query" id="query-label">
            <span>找什么</span>
            <input id="query" name="query" placeholder="例如：grenadilla 唇板的中级长笛" autocomplete="off" />
          </label>
          <label class="drop" id="drop">
            <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
            <img id="preview" alt="" hidden />
            <span id="drop-copy">点击或拖入一张商品图</span>
          </label>

          <fieldset class="filters">
            <legend>筛选</legend>
            <label>
              品牌
              <input id="brand" placeholder="Giardinelli" />
            </label>
            <label>
              最高售价
              <input id="max-price" type="number" min="0" step="1" placeholder="2000" />
            </label>
            <label class="check">
              <input id="in-stock" type="checkbox" />
              只看有货
            </label>
          </fieldset>
          <p class="hint">筛选对搜索和对话都生效，两边的结果分开显示。</p>
          <button class="submit" type="submit">搜索</button>
        </form>
        <p id="search-error" class="error" hidden></p>

        <div class="section-head">
          <h2>检索结果</h2>
          <p id="result-meta">只显示搜索到的商品</p>
        </div>
        <div id="results" class="results is-empty">
          <p class="empty">还没有检索结果。在上方搜索后，商品会出现在这里。</p>
        </div>
      </section>

      <aside class="chat panel">
        <div class="section-head">
          <h2>对话</h2>
          <p>按商品库回答</p>
        </div>
        <div id="thread" class="thread">
          <p class="hint">可以问「有哪些型号」，或「哪支长笛有 grenadilla 唇板」。</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="message" placeholder="问型号、价格或某一支的规格" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
        <p id="chat-error" class="error" hidden></p>
      </aside>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
