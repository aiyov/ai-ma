<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品检索</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand-lockup">
        <p class="eyebrow">Catalog search</p>
        <h1>商品检索</h1>
      </div>
      <div class="top-side">
        <label class="api-key">
          接口密钥
          <input id="api-key" type="password" autocomplete="off" placeholder="本地可留空" />
        </label>
        <p id="status" class="status">正在连接商品库…</p>
      </div>
    </header>

    <main>
      <section class="panel search-panel">
        <div class="modes" role="tablist">
          <button type="button" class="mode is-active" data-mode="text">文字</button>
          <button type="button" class="mode" data-mode="visual">外观</button>
          <button type="button" class="mode" data-mode="image">图片</button>
        </div>

        <form id="search-form">
          <label class="query" id="query-label">
            <span>描述你要找的乐器</span>
            <input id="query" name="query" placeholder="例如：grenadilla 唇板的中级长笛" autocomplete="off" />
          </label>
          <label class="drop" id="drop">
            <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
            <img id="preview" alt="" hidden />
            <span id="drop-copy">点击或拖入一张商品图，找外观相近的乐器</span>
          </label>
          <div class="filters">
            <label>
              品牌
              <input id="brand" placeholder="Giardinelli" />
            </label>
            <label>
              最高售价
              <input id="max-price" type="number" min="0" step="1" placeholder="2000" />
            </label>
            <label class="check">
              <input id="in-stock" type="checkbox" />
              只看有货
            </label>
          </div>
          <button class="submit" type="submit">搜索</button>
        </form>
        <p id="search-error" class="error" hidden></p>
      </section>

      <section>
        <div class="section-head">
          <h2>结果</h2>
          <p id="result-meta"></p>
        </div>
        <div id="results" class="results"></div>
      </section>

      <section class="panel chat-panel">
        <div class="section-head">
          <h2>对话</h2>
          <p>根据已入库的商品回答，不会编造价格和库存。</p>
        </div>
        <div id="thread" class="thread">
          <p class="hint">可以问「哪支长笛有 grenadilla 唇板」。</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="message" placeholder="问一句关于这些商品的问题" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
        <p id="chat-error" class="error" hidden></p>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
