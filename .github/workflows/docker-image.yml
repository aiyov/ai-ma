# Build and push the API image when a version tag is pushed from main.
#
#   git checkout main
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Image: ghcr.io/<owner>/<repo>:<tag>  and  :latest

name: Docker image

# GitHub cannot filter "tags on main" in `on:` — tags are not branch-scoped.
# Trigger on v* tags, then fail unless the tagged commit is reachable from main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch origin main --prune
          # Tagged SHA must be an ancestor of origin/main (i.e. that commit is on main).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on origin/main. Only tag commits that are already on main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on origin/main"

      - name: Image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
